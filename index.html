<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>โปรแกรมคำนวณบัญญัติไตรยางค์</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body {
            font-family: 'Prompt', sans-serif;
            background-color: #f0f9ff;
            background-image: radial-gradient(#bae6fd 1px, transparent 1px);
            background-size: 20px 20px;
        }
        .glass-panel {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.5);
        }
        .input-group:focus-within label {
            color: #0284c7;
        }
        .input-group:focus-within input {
            border-color: #0284c7;
            box-shadow: 0 0 0 3px rgba(2, 132, 199, 0.1);
        }
        /* Custom number input styling */
        input[type=number]::-webkit-inner-spin-button, 
        input[type=number]::-webkit-outer-spin-button { 
            -webkit-appearance: none; 
            margin: 0; 
        }
        .result-highlight {
            transition: all 0.3s ease;
        }
        .step-highlight {
            background-color: #f0fdf4;
            border-left: 4px solid #22c55e;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <div class="glass-panel w-full max-w-2xl rounded-2xl shadow-xl overflow-hidden flex flex-col">
        
        <!-- Header -->
        <div class="bg-gradient-to-r from-sky-500 to-indigo-600 p-6 text-white text-center relative overflow-hidden">
            <div class="absolute top-0 left-0 w-full h-full opacity-10">
                <svg viewBox="0 0 100 100" preserveAspectRatio="none">
                    <path d="M0 100 L100 0 L100 100 Z" fill="white"/>
                </svg>
            </div>
            <h1 class="text-3xl font-bold mb-2 relative z-10">บัญญัติไตรยางค์</h1>
            <p class="text-sky-100 text-sm relative z-10">Rule of Three Calculator</p>
        </div>

        <!-- Main Content -->
        <div class="p-6 md:p-8 space-y-8">

            <!-- Concept Sentence Form -->
            <div class="space-y-6">
                
                <!-- Row 1: IF ... EQUALS ... -->
                <div class="bg-white p-6 rounded-xl border border-gray-200 shadow-sm relative">
                    <div class="absolute -left-3 top-1/2 -translate-y-1/2 bg-sky-500 text-white w-8 h-8 rounded-full flex items-center justify-center font-bold shadow-md">1</div>
                    
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4 items-center">
                        <div class="input-group">
                            <label class="block text-sm text-gray-500 mb-1">ถ้าสิ่งนี้มี (A)</label>
                            <div class="relative">
                                <input type="number" id="inputA" placeholder="เช่น 3 (ชิ้น)" class="w-full pl-4 pr-10 py-3 rounded-lg border border-gray-300 outline-none transition-all text-gray-700 font-medium text-lg" oninput="calculate()">
                                <span class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400">หน่วย</span>
                            </div>
                        </div>

                        <div class="hidden md:flex justify-center text-gray-400">
                            <i data-lucide="arrow-right"></i>
                        </div>
                        <div class="md:hidden flex justify-center text-gray-400 py-2">
                            <i data-lucide="arrow-down"></i>
                        </div>

                        <div class="input-group">
                            <label class="block text-sm text-gray-500 mb-1">จะมีค่าเท่ากับ (B)</label>
                            <div class="relative">
                                <input type="number" id="inputB" placeholder="เช่น 10 (บาท)" class="w-full pl-4 pr-10 py-3 rounded-lg border border-gray-300 outline-none transition-all text-gray-700 font-medium text-lg" oninput="calculate()">
                                <span class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400">หน่วย</span>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Linker -->
                <div class="flex justify-center -my-3 relative z-10">
                    <span class="bg-indigo-50 text-indigo-600 px-4 py-1 rounded-full text-sm font-semibold border border-indigo-100 shadow-sm">แล้วถ้า...</span>
                </div>

                <!-- Row 2: THEN ... EQUALS ? -->
                <div class="bg-white p-6 rounded-xl border border-gray-200 shadow-sm relative">
                    <div class="absolute -left-3 top-1/2 -translate-y-1/2 bg-indigo-500 text-white w-8 h-8 rounded-full flex items-center justify-center font-bold shadow-md">2</div>
                    
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4 items-center">
                        <div class="input-group">
                            <label class="block text-sm text-gray-500 mb-1">สิ่งที่มี (C)</label>
                            <div class="relative">
                                <input type="number" id="inputC" placeholder="เช่น 6 (ชิ้น)" class="w-full pl-4 pr-10 py-3 rounded-lg border border-gray-300 outline-none transition-all text-gray-700 font-medium text-lg" oninput="calculate()">
                                <span class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400">หน่วย</span>
                            </div>
                        </div>

                        <div class="hidden md:flex justify-center text-gray-400">
                            <i data-lucide="arrow-right"></i>
                        </div>
                         <div class="md:hidden flex justify-center text-gray-400 py-2">
                            <i data-lucide="arrow-down"></i>
                        </div>

                        <div class="result-highlight bg-gradient-to-br from-green-50 to-emerald-50 rounded-lg p-3 border border-green-200 text-center relative overflow-hidden group cursor-pointer" onclick="copyResult()">
                            <label class="block text-xs text-green-600 font-semibold uppercase tracking-wider mb-1">ผลลัพธ์ที่จะได้</label>
                            <div id="resultDisplay" class="text-3xl font-bold text-green-700 min-h-[40px] flex items-center justify-center">...</div>
                            <div class="absolute top-2 right-2 opacity-0 group-hover:opacity-100 transition-opacity">
                                <i data-lucide="copy" class="w-4 h-4 text-green-500"></i>
                            </div>
                        </div>
                    </div>
                </div>

            </div>

            <!-- Explanation Section -->
            <div id="explanationBox" class="opacity-50 transition-all duration-500">
                <h3 class="text-gray-700 font-semibold mb-3 flex items-center gap-2">
                    <i data-lucide="book-open" class="w-5 h-5 text-indigo-500"></i>
                    วิธีทำ (Logic)
                </h3>
                <div class="step-highlight p-4 rounded-lg text-gray-700 space-y-2 text-sm md:text-base">
                    <div class="flex items-center gap-2">
                        <span class="w-6 h-6 rounded-full bg-green-100 text-green-700 flex items-center justify-center text-xs font-bold">1</span>
                        <p>นำค่าทางขวา <span class="font-mono bg-gray-100 px-1 rounded text-sky-600">(<span id="expB">B</span>)</span> หารด้วยค่าทางซ้าย <span class="font-mono bg-gray-100 px-1 rounded text-sky-600">(<span id="expA">A</span>)</span> เพื่อหาค่าต่อ 1 หน่วย</p>
                    </div>
                    <div class="pl-8 text-gray-500 font-mono text-xs md:text-sm">
                        <span id="mathStep1">B ÷ A = ?</span>
                    </div>

                    <div class="flex items-center gap-2 mt-3">
                        <span class="w-6 h-6 rounded-full bg-green-100 text-green-700 flex items-center justify-center text-xs font-bold">2</span>
                        <p>นำผลลัพธ์ที่ได้ ไปคูณกับ สิ่งที่ต้องการหา <span class="font-mono bg-gray-100 px-1 rounded text-indigo-600">(<span id="expC">C</span>)</span></p>
                    </div>
                     <div class="pl-8 text-gray-500 font-mono text-xs md:text-sm">
                        <span id="mathStep2">(Result) × C = Final Answer</span>
                    </div>

                    <div class="mt-4 pt-3 border-t border-green-200 flex flex-wrap items-center gap-2 font-semibold text-green-800">
                        <span>สูตร:</span>
                        <div class="bg-white px-3 py-1 rounded border border-green-200 shadow-sm flex items-center gap-2">
                            <span>( <span id="formulaB">B</span> ÷ <span id="formulaA">A</span> ) × <span id="formulaC">C</span> = <span id="formulaResult">?</span></span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Action Buttons -->
            <div class="flex justify-between items-center">
                <button onclick="clearInputs()" class="flex items-center gap-2 text-gray-500 hover:text-red-500 transition-colors text-sm font-medium px-4 py-2 rounded-lg hover:bg-red-50">
                    <i data-lucide="rotate-ccw" class="w-4 h-4"></i>
                    ล้างข้อมูล
                </button>
            </div>

        </div>
        
        <!-- Footer -->
        <div class="bg-gray-50 p-4 text-center text-xs text-gray-400 border-t border-gray-100">
